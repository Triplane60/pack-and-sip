<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack &amp; Sip | Admin Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-indigo-600">Pack &amp; Sip</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight">Order dashboard</h1>
      </div>
      <a href="/" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600 transition hover:border-indigo-300 hover:text-indigo-700">View store</a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm text-slate-500">Fulfillment overview</p>
        <h2 class="mt-1 text-3xl font-bold tracking-tight">All orders</h2>
      </div>
      <button id="refreshButton" type="button" class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-60">
        <span aria-hidden="true">↻</span> Refresh orders
      </button>
    </div>

    <section class="mb-6 grid gap-4 sm:grid-cols-3" aria-label="Order summary">
      <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-slate-500">Total orders</p>
        <p id="totalOrders" class="mt-2 text-3xl font-bold">0</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-slate-500">Needs attention</p>
        <p id="pendingOrders" class="mt-2 text-3xl font-bold text-amber-600">0</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-slate-500">Revenue</p>
        <p id="revenue" class="mt-2 text-3xl font-bold text-emerald-600">₱0.00</p>
      </div>
    </section>

        <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div id="message" class="hidden border-b px-5 py-3 text-sm" role="status"></div>
      <div class="overflow-x-auto">
        <table class="w-full border-collapse text-left text-sm table-auto">
          <thead class="bg-slate-50 text-xs uppercase tracking-wider text-slate-500">
            <tr>
              <th class="px-5 py-4 font-semibold">Order ID</th>
              <th class="px-5 py-4 font-semibold">Customer</th>
              <th class="px-5 py-4 font-semibold">Contact</th>
              <th class="px-5 py-4 font-semibold">Shipping address</th>
              <th class="px-5 py-4 font-semibold">Items</th>
              <th class="px-5 py-4 font-semibold">Total</th>
              <th class="px-5 py-4 font-semibold">Status</th>
              <th class="px-5 py-4 font-semibold">Actions</th>
              <th class="px-5 py-4 font-semibold text-red-600">Danger Zone</th>
        </tr>
      </thead>


          <tbody id="ordersTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden px-6 py-16 text-center">
        <p class="text-lg font-semibold text-slate-700">No orders yet</p>
        <p class="mt-1 text-sm text-slate-500">New customer orders will appear here.</p>
      </div>
    </section>
  </main>

  <script>
    const statuses = ['Pending', 'Paid', 'Shipping', 'Completed'];
    const ADMIN_API_URL = '/api/admin/orders';
    const currency = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' });
    const ordersTableBody = document.getElementById('ordersTableBody');
    const emptyState = document.getElementById('emptyState');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = `border-b px-5 py-3 text-sm ${isError ? 'border-red-100 bg-red-50 text-red-700' : 'border-emerald-100 bg-emerald-50 text-emerald-700'}`;
    }

    function formatAddress(order) {
      return order.shipping_address || '—';
    }

        function formatItems(order) {
      const items = [];
      if (Number(order.cup_boxes || 0) > 0) {
        items.push(`Cups: ${order.cup_size || 'Selected size'} (${Number(order.cup_boxes)} box${Number(order.cup_boxes) === 1 ? '' : 'es'})`);
      }
      if (Number(order.lid_boxes || 0) > 0) {
        items.push(`Lids: ${order.lid_style || 'Selected style'} Lid (${Number(order.lid_boxes)} box${Number(order.lid_boxes) === 1 ? '' : 'es'})`);
      }
      if (Number(order.microwavable_boxes || 0) > 0) {
        items.push(`Microwavable: ${order.microwavable_size || 'Selected size'} (${Number(order.microwavable_boxes)} box${Number(order.microwavable_boxes) === 1 ? '' : 'es'})`);
      }
      return items.length ? items.join('<br>') : '—';
    }


    function renderOrders(orders) {
      ordersTableBody.replaceChildren();
      emptyState.classList.toggle('hidden', orders.length !== 0);
      document.getElementById('totalOrders').textContent = orders.length;
      document.getElementById('pendingOrders').textContent = orders.filter(order => order.status === 'Pending').length;
      document.getElementById('revenue').textContent = currency.format(orders.reduce((sum, order) => sum + Number(order.total_amount || 0), 0));

      orders.forEach(order => {
        const row = document.createElement('tr');
        row.className = 'align-top transition hover:bg-slate-50';
                row.innerHTML = `
          <td class="whitespace-nowrap px-5 py-4 font-bold text-indigo-700">#${order.id}</td>
          <td class="px-5 py-4"><div class="font-semibold text-slate-800">${order.full_name || '—'}</div></td>
                    <td class="px-5 py-4 text-slate-600"><div>${order.email || '—'}</div><div class="mt-1">${order.phone_number || '—'}</div></td>
          <td class="max-w-[220px] whitespace-normal px-5 py-4 text-slate-600">${formatAddress(order)}</td>
          <td class="whitespace-normal px-5 py-4 text-xs font-semibold leading-6 text-slate-600">${formatItems(order)}</td>
          <td class="whitespace-nowrap px-5 py-4 font-bold text-slate-800">${currency.format(Number(order.total_amount || 0))}</td>
          <td class="px-5 py-4"><select data-order-id="${order.id}" class="status-select rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-sm font-semibold text-slate-700 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" onchange="toggleDeleteButton(${order.id}, this.value)">${statuses.map(status => `<option value="${status}" ${status === order.status ? 'selected' : ''}>${status}</option>`).join('')}</select></td>
          <td class="px-5 py-4"><button type="button" data-save-id="${order.id}" class="save-button rounded-lg border border-indigo-200 px-3 py-2 text-xs font-bold text-indigo-700 transition hover:bg-indigo-50">Save status</button></td>
          <td class="px-5 py-4"><button type="button" data-delete-id="${order.id}" class="delete-button rounded-lg bg-red-50 px-3 py-2 text-xs font-bold text-red-600 transition hover:bg-red-600 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed" ${order.status === 'Completed' ? '' : 'disabled'}>Delete</button></td>
        `;


        ordersTableBody.appendChild(row);
      });
    }

    async function fetchOrders() {
      const refreshButton = document.getElementById('refreshButton');
      refreshButton.disabled = true;
      try {
        const response = await fetch(ADMIN_API_URL);
        if (!response.ok) throw new Error('Unable to load orders.');
        const data = await response.json();
        renderOrders(data.orders || []);
        showMessage(`Updated ${data.orders ? data.orders.length : 0} order${data.orders && data.orders.length === 1 ? '' : 's'}.`);
      } catch (error) {
        showMessage(error.message, true);
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function updateStatus(orderId, status, button) {
      button.disabled = true;
      try {
        const response = await fetch(`${ADMIN_API_URL}/${orderId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to update status.');
        showMessage(`Order #${orderId} marked ${data.order.status}.`);
        await fetchOrders();
      } catch (error) {
        showMessage(error.message, true);
        button.disabled = false;
      }
    }

        function toggleDeleteButton(orderId, status) {
      const btn = document.querySelector(`[data-delete-id="${orderId}"]`);
      if (btn) btn.disabled = (status !== 'Completed');
    }

    async function deleteOrder(orderId, button) {
      if (!confirm(`Are you sure you want to delete Order #${orderId}? This action cannot be undone.`)) return;
      button.disabled = true;
      try {
        const response = await fetch(`/api/orders/delete/${orderId}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to delete order.');
        button.closest('tr').remove();
        showMessage(`Order #${orderId} deleted.`);
      } catch (error) {
        showMessage(error.message, true);
        button.disabled = false;
      }
    }

    ordersTableBody.addEventListener('click', event => {
      const saveBtn = event.target.closest('[data-save-id]');
      if (saveBtn) {
        const row = saveBtn.closest('tr');
        const status = row.querySelector('.status-select').value;
        updateStatus(saveBtn.dataset.saveId, status, saveBtn);
        return;
      }

      const deleteBtn = event.target.closest('[data-delete-id]');
      if (deleteBtn) {
        deleteOrder(deleteBtn.dataset.deleteId, deleteBtn);
      }
    });


    document.getElementById('refreshButton').addEventListener('click', fetchOrders);
    document.addEventListener('DOMContentLoaded', fetchOrders);
  </script>
</body>
</html>
